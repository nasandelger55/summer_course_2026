<!DOCTYPE html>
<html lang="mn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Grid Layout</title>
    <link rel="stylesheet" href="./exercise.css">
</head>

<body>

    <div class="dashboard-container">

        <header class="header">
            <h2>admin Dashboard</h2>
        </header>


        <aside class="sidebar">
            <nav>
                <ul>
                    <li><a href="#">home</a></li>
                    <li><a href="#">Analytics</a></li>
                    <li><a href="#">Settings</a></li>
                </ul>
            </nav>
        </aside>


        <main class="main-content">
            <div class="stat-card">

            </div>
            <div class="stat-card">
                <h3>Revenue</h3>

            <div class="stat-card">

            </div>
            <div class="stat-card">
                <h3></main-content></h3>

            </div>

        <footer class="footer">
            <p>&copy; 2026 Dashboard Project</p>
        </footer>
    </div>
